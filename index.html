<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Portfolio</title>
    <style>
        /* =========================================
           RESET E IMPOSTAZIONI GLOBALI
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #00FF41; /* Verde Neon stile Matrix/CRT */
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            line-height: 1.6;
            padding: 20px;
            /* Effetto bagliore (glow) per simulare i fosfori dei vecchi monitor */
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.4);
            overflow-x: hidden;
        }

        /* =========================================
           EFFETTO RETRÒ: SCANLINES
           ========================================= */
        /* Crea le linee di scansione orizzontali tipiche dei monitor CRT */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        /* =========================================
           PROMPT DEI COMANDI
           ========================================= */
        .prompt-line {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .user {
            color: #00FF41;
            font-weight: bold;
        }

        .host {
            color: #00FF41;
            font-weight: bold;
        }

        .path {
            color: #00FF41;
        }

        .symbol {
            margin-right: 8px;
            color: #00FF41;
        }

        .command {
            color: #ffffff; /* Il comando digitato spicca in bianco */
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
        }

        /* =========================================
           LINK E INTERATTIVITÀ
           ========================================= */
        a {
            color: #00FF41;
            text-decoration: none;
            padding: 0 2px;
            transition: all 0.1s ease;
            position: relative;
            z-index: 3; /* Assicura che i link siano cliccabili sopra le scanlines */
        }

        a::before {
            content: "[ ";
            opacity: 0.5;
        }

        a::after {
            content: " ]";
            opacity: 0.5;
        }

        /* Effetto hover: inverte i colori come nei vecchi terminali */
        a:hover {
            background-color: #00FF41;
            color: #000000;
            text-shadow: none;
        }

        a:hover::before, a:hover::after {
            opacity: 1;
            color: #000000;
        }

        /* =========================================
           CURSORE LAMPEGGIANTE
           ========================================= */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #00FF41;
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 1s step-end infinite;
            box-shadow: 0 0 5px rgba(0, 255, 65, 0.8);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* =========================================
           UTILITY CLASSES
           ========================================= */
        .output {
            margin-bottom: 20px;
            padding-left: 10px;
        }
    </style>
</head>
<body>

    <!-- Esempio di struttura base per testare il CSS -->
    <div class="prompt-line">
        <span class="user">user</span>@<span class="host">portfolio</span>:<span class="path">~</span><span class="symbol">$</span>
        <span class="command">ls -l</span>
    </div>
    
    <div class="output">
        <p>total 42</p>
        <p>drwxr-xr-x 2 user portfolio 4096 Oct 15 10:26 <a href="#">projects</a></p>
        <p>drwxr-xr-x 2 user portfolio 4096 Oct 15 10:26 <a href="#">statistics</a></p>
        <p>-rw-r--r-- 1 user portfolio 1024 Oct 15 10:26 <a href="#">about.txt</a></p>
    </div>

    <div class="prompt-line">
        <span class="user">user</span>@<span class="host">portfolio</span>:<span class="path">~</span><span class="symbol">$</span>
        <span class="cursor"></span>
    </div>

</body>
</html>
