<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Portfolio</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Esempio di struttura base per testare il CSS -->
    <div class="prompt-line">
        <span class="user">user</span>@<span class="host">portfolio</span>:<span class="path">~</span><span class="symbol">$</span>
        <span class="command">ls -l</span>
    </div>
    
    <div class="output">
        <p>total 42</p>
        <p>drwxr-xr-x 2 user portfolio 4096 Oct 15 10:26 <a href="#">projects</a></p>
        <p>drwxr-xr-x 2 user portfolio 4096 Oct 15 10:26 <a href="#">statistics</a></p>
        <p>-rw-r--r-- 1 user portfolio 1024 Oct 15 10:26 <a href="#">about.txt</a></p>
    </div>

    <div class="prompt-line">
        <span class="user">user</span>@<span class="host">portfolio</span>:<span class="path">~</span><span class="symbol">$</span>
        <span class="cursor"></span>
    </div>

</body>
</html>
